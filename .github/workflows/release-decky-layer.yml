name: (Release) Decky layer bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable owner-fork release tag
        required: true
        default: v2.0.0-decky.1
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: glibc-x86_64
            asset: lsfg-vk-layer-x86_64.tar.xz
            architecture: x86_64
          - target: glibc-aarch64
            asset: lsfg-vk-layer-aarch64.tar.xz
            architecture: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang cmake ninja-build g++-aarch64-linux-gnu
      - name: Build portable layer bundle
        run: |
          scripts/build-layer-bundles.sh --clean --target "${{ matrix.target }}"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "out/layer-bundles/${{ matrix.target }}" \
            -cJf "${{ matrix.asset }}" \
            liblsfg-vk-layer.so VkLayer_LSFGVK_frame_generation.json
          tests/verify-decky-layer-archive.sh "${{ matrix.asset }}" "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Assemble checksums
        run: |
          find release-assets -name '*.tar.xz' -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum lsfg-vk-layer-*.tar.xz > SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/lsfg-vk-layer-*.tar.xz release-assets/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/lsfg-vk-layer-*.tar.xz release-assets/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "lsfg-vk Decky layer $RELEASE_TAG" \
              --notes "Portable x86_64 and Armada/aarch64 lsfg-vk v2 layer bundles for Decky." \
              "${flags[@]}"
          fi
